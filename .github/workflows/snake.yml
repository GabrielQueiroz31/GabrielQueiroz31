name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: GabrielQueiroz31
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00BFFF&color_dots=161B22,0A3D62,0E6BA8,00A8FF,00D9FF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=00BFFF&color_dots=161B22,0A3D62,0E6BA8,00A8FF,00D9FF

      - name: Push snake animation to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
